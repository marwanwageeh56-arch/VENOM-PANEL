<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">
  <div class="max-w-md mx-auto space-y-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <h1 class="text-lg font-bold text-cyan-400">لوحة الإدارة - إنشاء المفاتيح</h1>
      <a href="/" class="text-xs text-slate-400 underline">صفحة العميل</a>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex gap-2">
      <select id="days" class="bg-slate-950 border border-slate-700 rounded-xl px-2 py-2 text-xs outline-none flex-1">
        <option value="1">1 يوم</option>
        <option value="7">7 أيام</option>
        <option value="30" selected>30 يوم</option>
      </select>
      <button onclick="createKey()" class="bg-cyan-600 px-4 py-2 rounded-xl text-xs font-bold">توليد مفتاح</button>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
      <h2 class="text-xs font-bold text-slate-400">المفاتيح المنشأة:</h2>
      <div id="keysList" class="space-y-2 text-xs font-mono"></div>
    </div>
  </div>

  <script>
    async function loadKeys() {
      const res = await fetch('/api/admin/keys');
      const keys = await res.json();
      const list = document.getElementById('keysList');
      list.innerHTML = '';
      keys.forEach(k => {
        list.innerHTML += `
          <div class="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg border border-slate-800">
            <span class="text-cyan-300 font-bold">${k.code}</span>
            <span class="text-slate-400">${k.days} يوم</span>
            <span class="${k.usedAt ? 'text-emerald-400' : 'text-amber-400'}">${k.usedAt ? 'مستخدم' : 'جديد'}</span>
          </div>
        `;
      });
    }

    async function createKey() {
      const days = document.getElementById('days').value;
      await fetch('/api/admin/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days })
      });
      loadKeys();
    }
    loadKeys();
  </script>
</body>
</html>
